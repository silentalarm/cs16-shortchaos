; AMX Mod X plugins. Only our own plugins: every third-party feature is either reimplemented here
; or deliberately absent, so the image ships fewer binaries and has fewer ways to break the stream.
;
; CSDM is built from source (infra/build-csdm.sh) but NOT loaded: its plugins need the csdm_amxx C++
; module, which is not built (it needs HLSDK headers and a 32-bit toolchain).
; csdm_lite is our own respawn "meat grinder" and replaces it - see docs/runbook.md.
