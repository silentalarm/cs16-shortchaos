; AMX Mod X plugins. Only our own plugins: every third-party feature is either reimplemented here
; or deliberately absent, so the image ships fewer binaries and has fewer ways to break the stream.
;
; There is no CSDM in this image: its plugins need the csdm_amxx C++ module, which needs HLSDK
; headers and a 32-bit toolchain, and our own respawn "meat grinder" covers what the stream needs.
csdm_lite.amxx

donation_events.amxx
team_war.amxx
stream_cam.amxx
chaos_core.amxx
; Owns the map rotation: rounds are endless, so the engine never rotates on its own - the plugin
; ends the map with a duel between the two team tops.
map_duel.amxx
