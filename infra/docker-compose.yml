# Runs the game server (image built by infra/update-checksums.ps1 + docker buildx), the
# control API next to it, and the capture container that puts the match on YouTube.
#
# hlds and stream share the server-data volume: the stream container reads valve/ and cstrike/
# from it (read-only) and keeps its own writable copy for the engine in client-data.
name: cs16-youtube

services:
  hlds:
    image: cs16-hlds:local
    restart: unless-stopped
    # llvmpipe (software OpenGL, in the capture container) and libx264 fight for the same cores, and
    # a starved renderer shows up as a stuttering capture: the heavy containers can be pinned to
    # their own CPUs. Empty means no pinning, and a cpuset that names cores the host does not have
    # makes `compose up` fail instead of silently running slower - keep it in .env, per host.
    cpuset: ${HLDS_CPUSET:-}
    environment:
      # Fight-yard pool only: the stream must never start - or fall back - on a stock map.
      MAP: ${MAP:-fy_iceworld}
      MAPCYCLE: ${MAPCYCLE:-fy_iceworld,fy_pool_day,fy_snow,fy_buzzkill,fy_simpsons,fy_aztec,fy_dustworld}
      # First person camera (plugins/stream_cam): 0 = chase camera only, 1 = cut into the bot's eyes
      # for a moment after a kill. Off by default - this is the pilot switch for the feature.
      STREAM_POV: ${STREAM_POV:-0}
      MAXPLAYERS: ${MAXPLAYERS:-22}
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}
    # Loopback only, exactly like the panel: RCON rides TCP 27015, so a publish on every interface
    # puts the operator password on the internet and one leaked value is `rcon_password <theirs>`.
    # Nothing in the stack needs the host mapping - the control API and the capture client reach the
    # server by service name (`hlds:27015`) over the compose network - so this exists only for
    # playing from the host by hand. Drop the prefix or add a firewall rule and the port is public.
    ports:
      - "127.0.0.1:27015:27015/tcp"
      - "127.0.0.1:27015:27015/udp"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    volumes:
      # Populated from the image on first start, then shared read-only with the stream service.
      - server-data:/hlds
      - hlds-logs:/hlds/cstrike/logs
      # Custom maps (fy_pool_day and friends): drop .bsp/.res/.nav/.txt into infra/maps and the
      # entrypoint copies them next to the stock ones. Nothing is downloaded during the build, so a
      # map is exactly the file the operator put there - and a stock map is never overwritten.
      - ../infra/maps:/hlds/cstrike/maps-extra:ro

  # One-shot fix-up of the shared overlay volume. Compose creates a fresh named volume owned by root,
  # and the API runs as uid 1000: without this it cannot write a single layer file ("EACCES ...
  # bar-t.txt.tmp") and the whole picture panel stays empty. `chown` works inside a volume (a real
  # Linux filesystem) even where a Windows bind mount refuses it. The `ui` directory is created here
  # as well, so the capture container can never create it first as root and lock the API out.
  control-init:
    image: node:24-bookworm-slim
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /overlay/ui && chown -R 1000:1000 /overlay"]
    cap_drop:
      - ALL
    # chown needs exactly one capability; dropping everything and adding it back is narrower than
    # running the container with the default root capabilities.
    cap_add:
      - CHOWN
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - overlay-data:/overlay

  control-api:
    image: node:24-bookworm-slim
    restart: unless-stopped
    # Not root: this container talks to the game server with RCON rights, so it gets the image's own
    # unprivileged user instead of uid 0. Everything it needs to write is mounted below.
    user: "node"
    depends_on:
      hlds:
        condition: service_started
      control-init:
        condition: service_completed_successfully
    working_dir: /app
    env_file:
      - ../.env
    environment:
      # Own network namespace, not the game server's: publishing a port for a container that shares
      # another container's namespace gives an empty reply from Docker's proxy on Windows. RCON is
      # reached by service name instead.
      RCON_HOST: hlds
      RCON_PORT: "27015"
      DB_PATH: /app/data/control.db
      # The overlay text the capture container draws; a shared volume, because two containers of
      # different images have no other way to exchange a file.
      OVERLAY_DIR: /app/overlay
      ADMIN_BIND: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT:-8080}
      # Runtime tweaks live in the data volume, not in the git-tracked catalogue.
      ACTIVITIES_OVERRIDE_PATH: /app/data/activities.override.json
      # Telemetry written by the capture container (mounted read-only below).
      STREAM_STATUS_DIR: /game/.stream
    ports:
      # Loopback only: the panel can send RCON commands, so it must never be reachable from the
      # network. On a VPS reach it through an SSH tunnel.
      - "127.0.0.1:${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    command: ["node", "src/main.ts"]
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      # The source is code, not data: it is mounted read-only, so a bug in the control API cannot
      # rewrite the repository it was started from.
      - ..:/app:ro
      # Writable state lives on the host: the game's SQLite history. A bind mount (not a named volume)
      # because the operator may want to look at the database; on Linux the host directory must belong
      # to uid 1000 (`chown -R 1000:1000 data`), the API does not run as root.
      - ../data:/app/data
      # The overlay text the encoder draws is a named volume, chowned by `control-init` above: the
      # capture container would otherwise create its files as root and the API could not write them.
      - overlay-data:/app/overlay
      - client-data:/game:ro

  # Local debugging hub: receives exactly the RTMP push the stream container sends to YouTube,
  # so the picture can be watched in a browser without a stream key and without going live.
  # Only started with `--profile local-view`; the production stack never brings it up.
  # No config file on purpose: the shipped defaults accept any publish path and expose
  # RTMP 1935, HLS 8888, WebRTC 8889 — see docs/runbook.md.
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    profiles: ["local-view"]
    environment:
      # The publisher (our CPU encoder) can take more than the default 10 s to produce its first
      # packet on a loaded machine, and the hub then drops it as idle. 60 s only affects this local
      # debugging hub; YouTube's ingest is not involved.
      MTX_READTIMEOUT: 60s
      # WebRTC ICE: without this the browser is offered the container's private address and gives up.
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
      MTX_WEBRTCIPSFROMINTERFACES: "no"
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  stream:
    image: cs16-stream:local
    restart: unless-stopped
    # See HLDS_CPUSET on the game server: pin the renderer+encoder to their own cores. Empty = free.
    cpuset: ${STREAM_CPUSET:-}
    depends_on:
      hlds:
        condition: service_started
      # The overlay volume must be chowned before this container touches it: it runs as root and
      # would otherwise create /overlay/ui root-owned, which locks the API out of its own panel.
      control-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      SERVER_ADDR: hlds:27015
      STREAM_ORIENTATION: ${STREAM_ORIENTATION:-vertical}
      STREAM_WIDTH: ${STREAM_WIDTH:-720}
      STREAM_HEIGHT: ${STREAM_HEIGHT:-1280}
      # No STREAM_CAPTURE_* here on purpose: the client renders at the canvas width, and the vertical
      # layout derives the render height from the canvas and the band height so the picture fills the
      # frame (stale values in .env used to leave a 4:3 render and a padded frame).
      # Height of each spectator band in percent of the capture; the encoder cuts them off. 0 keeps
      # the bands (and the dimmed picture behind them).
      STREAM_BAND_PERCENT: ${STREAM_BAND_PERCENT:-20}
      STREAM_FPS: ${STREAM_FPS:-30}
      STREAM_BITRATE_KBPS: ${STREAM_BITRATE_KBPS:-3000}
      # Software OpenGL renders with 2 threads by default: llvmpipe otherwise takes every core and
      # starves the encoder (see infra/stream/Dockerfile).
      LP_NUM_THREADS: ${LP_NUM_THREADS:-2}
      # Inside the container the encoder writes next to the game dir, which is the volume the
      # control API mounts read-only. Overrides the host path from the env file.
      STREAM_STATUS_DIR: /game/.stream
      # Donation text written by the control API through the shared volume. Empty disables the
      # overlay layer, which is also what happens when the image has no font.
      STREAM_OVERLAY_TXT: /overlay/overlay.txt
      # The picture panel: the control API writes one small text file per line (the score bar with
      # its two frag counts, both team tops, the bot on camera, the last donation, how to buy the
      # next one) into the shared volume and the encoder draws them with drawtext. Same volume,
      # ten files.
      STREAM_UI_DIR: ${STREAM_UI_DIR:-/overlay/ui}
      STREAM_UI_TEXT: ${STREAM_UI_TEXT:-1}
      STREAM_UI_SIZE_BAR: ${STREAM_UI_SIZE_BAR:-40}
      STREAM_UI_SIZE_SCORE: ${STREAM_UI_SIZE_SCORE:-28}
      STREAM_UI_SIZE_TOP: ${STREAM_UI_SIZE_TOP:-30}
      STREAM_UI_SIZE_TARGET: ${STREAM_UI_SIZE_TARGET:-36}
      STREAM_UI_SIZE_LAST: ${STREAM_UI_SIZE_LAST:-30}
      STREAM_UI_SIZE_MENU: ${STREAM_UI_SIZE_MENU:-24}
      STREAM_UI_MARGIN: ${STREAM_UI_MARGIN:-52}
      STREAM_UI_TOP: ${STREAM_UI_TOP:-36}
      STREAM_UI_BOTTOM: ${STREAM_UI_BOTTOM:-186}
      # The colours the game uses for the health cross and the armour shield: red side, blue side.
      STREAM_UI_COLOR_T: ${STREAM_UI_COLOR_T:-0xDD3333}
      STREAM_UI_COLOR_CT: ${STREAM_UI_COLOR_CT:-0x3366DD}
      STREAM_UI_COLOR_TEXT: ${STREAM_UI_COLOR_TEXT:-white}
      STREAM_UI_COLOR_MUTED: ${STREAM_UI_COLOR_MUTED:-0xB9C2CF}
      # 0 hides the two bottom lines (last donation, how to buy the next one) and keeps the rest.
      STREAM_UI_DONATE: ${STREAM_UI_DONATE:-1}
      # `info` prints the encoder progress (frame, fps, bitrate) into the container log, which is how
      # a "Preparing stream" on YouTube is told apart from an encoder that sends nothing.
      STREAM_FFMPEG_LOGLEVEL: ${STREAM_FFMPEG_LOGLEVEL:-warning}
      # Empty by default: the encoder then pushes to YouTube with YOUTUBE_STREAM_KEY.
      # For local viewing: rtmp://mediamtx:1935/live/test (see docs/runbook.md).
      STREAM_OUTPUT: ${STREAM_OUTPUT:-}
      # YouTube ingest. RTMPS on 443, not plain RTMP on 1935: some ISPs drop the 1935 flow right
      # after the handshake packet and ffmpeg then reports "Cannot read RTMP handshake response".
      # This key overrides STREAM_RTMP from the env file on purpose, so a stale plain-RTMP value
      # there cannot break the push; RTMP_INGEST_URL in .env is the way to point it elsewhere.
      STREAM_RTMP: ${RTMP_INGEST_URL:-rtmps://a.rtmps.youtube.com:443/live2}
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # ffmpeg and the engine need a bit of shared memory for X11 buffers.
    shm_size: "256m"
    tmpfs:
      - /tmp
    volumes:
      - server-data:/server:ro
      - client-data:/game
      # Same named volume the control API writes: it is chowned by `control-init`, and this container
      # reads it as root, so the panel and the encoder always see one directory.
      - overlay-data:/overlay

volumes:
  hlds-logs:
  server-data:
  client-data:
  overlay-data:

