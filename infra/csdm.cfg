; CSDM settings: copied to amxmodx/configs/csdm.cfg and re-synced on every container start.
; NOTHING READS THIS FILE TODAY. No CSDM plugin is loaded (infra/plugins.ini loads csdm_lite
; instead), so every key below is inert. It stays because the same pinned CSDM tarball ships
; configs/csdm/<map>.spawns.cfg, and csdm_lite does read those for its spawn points. Keys and
; values keep the upstream format, so the file can be dropped back into a real CSDM server.

[settings]
enabled = 1
; The plugin hands out the weapon, the bot plugin must not buy its own: that is what makes a
; respawning bot always armed and always different.
strip_weapons = 1
; preset spawn points: the file ships with CSDM and validates them against the map
spawnmode = preset
remove_bomb = 1
; Half a second between death and respawn: dead air is what kills a 24/7 stream.
spawn_wait_time = 0.5

[ffa]
; Free for all is on, but not from here: csdm_ffa is neither built (infra/build-csdm.sh) nor loaded,
; so this key is never read. The real switch is `yb_csdm_mode 2` with `mp_friendlyfire 1` in
; infra/server.cfg - the bot plugin drops team checks when it picks a target.
enabled = 0

[misc]
; a = as_ maps, b = buyzones, c = cs_ maps, d = de_ maps
remove_objectives = abcd
block_buy = 1
ammo_refill = 1
spawn_radio_msg = 0

[ticketing]
enabled = 0

[protection]
enabled = 1
colors = "0 255 0 200"
; One second: long enough not to die with the spawn menu still on screen, short enough that the
; picture keeps moving.
time = 1

[equip]
menus = psa
autoitems = ah
grenades = h
fnadesnum = 1

; Bots do not open the equip menu, they are armed from these two lists. Keep them short: a bot
; holding an AWP in a 3-second round is a different game from one holding an XM1014.
[botprimary]
ak47 AK47 1
m4a1 M4A1 1
awp AWP 1
xm1014 XM1014 1
p90 P90 1
mp5navy "MP5 Navy" 1

[botsecondary]
deagle Deagle 1
usp USP 1
