; CSDM settings for the donation stream (the "meat grinder" mode).
; Only keys that exist in the upstream file are used: the plugin reads exactly this format.
; Everything here is copied to amxmodx/configs/csdm.cfg and re-synced on every container start.

[settings]
enabled = 1
; The plugin hands out the weapon, the bot plugin must not buy its own: that is what makes a
; respawning bot always armed and always different.
strip_weapons = 1
; preset spawn points: the file ships with CSDM and validates them against the map
spawnmode = preset
remove_bomb = 1
; Half a second between death and respawn: dead air is what kills a 24/7 stream.
spawn_wait_time = 0.5

[ffa]
; Off on purpose. YaPB keeps its team logic, and a free-for-all flag makes it shoot team-mates,
; which reads as broken AI on the stream. The grinder is ordinary TDM with instant respawns.
enabled = 0

[misc]
; a = as_ maps, b = buyzones, c = cs_ maps, d = de_ maps
remove_objectives = abcd
block_buy = 1
ammo_refill = 1
spawn_radio_msg = 0

[ticketing]
enabled = 0

[protection]
enabled = 1
colors = "0 255 0 200"
; One second: long enough not to die with the spawn menu still on screen, short enough that the
; picture keeps moving.
time = 1

[equip]
menus = psa
autoitems = ah
grenades = h
fnadesnum = 1

; Bots do not open the equip menu, they are armed from these two lists. Keep them short: a bot
; holding an AWP in a 3-second round is a different game from one holding an XM1014.
[botprimary]
ak47 AK47 1
m4a1 M4A1 1
awp AWP 1
xm1014 XM1014 1
p90 P90 1
mp5navy "MP5 Navy" 1

[botsecondary]
deagle Deagle 1
usp USP 1
