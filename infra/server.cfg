// CS 1.6 server config for the donation stream. rcon_password is replaced at container start.
hostname "cs16-youtube | donations change the rules"
rcon_password "changeme"
// The streaming client is an open-source engine (Xash3D/CS16Client) without a Steam ticket, so
// the server must run in LAN mode: with sv_lan 0 it answers "STEAM validation rejected" and the
// client never joins. Streaming does not need VAC; bots play and viewers only watch the stream.
sv_lan 1
sv_region 255

// Rounds have no time limit of their own: CSDM respawns every bot within half a second, so a round
// only ends when a whole team happens to be down, and the timer used to chop the fight mid-action.
// The engine clamps this cvar at 9 minutes (a value of 60 reads back as 9), which is longer than the
// 10 minute map, so the only thing that ends a map is the duel in plugins/map_duel.
mp_timelimit 0
mp_roundtime 9
mp_freezetime 1
mp_forcechasecam 0

// TEAM PLAY: T against CT. The mode cvar is about the *game*, not about targeting: 0 lets YaPB
// auto-detect, 1 = CSDM (respawn, no rounds), no free-for-all, 2 = CSDM + FFA. This server is a
// respawn deathmatch - csdm_lite brings every dead bot back in half a second - so the bot has to be
// told that, or it plays a round-based game that does not exist: see the comment at yb_csdm_mode.
// Friendly fire is off so a stray shot does not feed the other side's scoreboard, which is what
// plugins/team_war counts: a frag for the killer's team, and a team kill cannot happen at all.
mp_friendlyfire 0
mp_tkpunish 0
mp_autoteambalance 0
mp_limitteams 0

// 1 = CSDM enabled, FFA disabled. This single cvar is what kept bots *sitting down behind cover*,
// and it took reading YaPB's source to see why (docs/runbook.md, "Why the bots stood still"):
//   - combat.cpp: the "take cover" branch (`startTask (Task::SeekCover)` plus `m_moveSpeed = 0` when
//     the bot's health times aggression is under 50) runs **only** when the CSDM flag is off. A bot
//     that shoots, gets hurt and walks backwards into a corner is that branch;
//   - botlib.cpp: `spawned()` only calls `newRound()` and `clearTasks()` in CSDM mode, and it is
//     called on every death. Without it a bot respawned by csdm_lite keeps the task list from its
//     previous life - the stale goal that walks into a wall (yapb#479);
//   - tasks.cpp: camping is skipped in CSDM mode as well, so `yb_camping_allowed 0` is belt and
//     braces rather than the fix.
// FFA stays off (that is mode 2), so bots still pick targets by team. server.cfg cannot pin this on
// its own: YaPB re-executes its own conf/yapb.cfg - which ships `yb_csdm_mode "0"` - on every map
// change, so the value that wins is the one infra/entrypoint.sh writes into that file.
yb_csdm_mode 1

// Do NOT pin the bots to one team (`yb_join_team "ct"`): with nobody on the other side the engine
// keeps most of the bots dead and idle - measured 0-1 kills per 40 s against 90 per 40 s with two
// teams. The teams stay, but friendly fire and FFA targeting make every bot a target.
// plugins/team_war turns that into the stream format: T vs CT, and a team kill counts for the
// killer's team, so a stray friendly frag still moves the score.

// The stream camera is a real client that never presses a key. With autokick on, the engine
// removes it ("has been idle for too long and has been kicked") after a couple of minutes and the
// stream freezes on the menu the client drops back to. The server is password protected and
// bot-only, so there is nobody to protect here.
mp_autokick 0

// Defaults that activities temporarily change and restore.
sv_gravity 800
sv_maxspeed 320

// Bots are spawned by YaPB; quota and difficulty cvar names differ between
// YaPB and PodBot, the plugin tries both (see plugins/donation_events).
yb_quota 20
yb_quota_mode normal
yb_autovacate 0
// Bots chat during the round. This was off at first ("only noise in the picture"), but on a 24/7
// stream with no human players a silent server reads as dead: chat lines are the only trace that
// something is alive. Keep the percentage low so it stays a detail and not a wall of text.
// yb_radio_mode: 0 = neither radio nor chatter, 1 = radio only, 2 = both (the bot default).
yb_radio_mode 0
yb_chat 1
yb_chat_percent 3
yb_display_welcome_text 0

// Bot behaviour for a stream with no humans. The two knife knobs are not the same thing:
// yb_random_knife_attacks lets a rushing bot carry the knife while nobody is near (the way a human
// rotates), so it stays on - a bot with a rifle in an empty corridor looks frozen. yb_stab_close_enemies
// makes a bot stab a nearby enemy instead of shooting it, which on the stream reads as a broken bot, so
// that one is off. Camping and shift-walking hide the action the same way: bots keep running and
// shooting instead of standing in a corner.
yb_random_knife_attacks 1
yb_stab_close_enemies 0

// Reserve ammo never runs out (plugins/csdm_lite tops it up once a second), but a magazine still
// empties and is still reloaded. mp_infinite_ammo stays 0 on purpose: that mode fills the magazine,
// which removes the reload from the picture.
mp_infinite_ammo 0

// Logs: the plugin writes here, `docker logs` shows them too.
log on
mp_logfile 1
mp_logmessages 1
// mp_logmessages echoes the console to the logs, and with it every RCON line - the password
// included - lands in stdout, where the stream container and `docker logs` can read it.
// Kept anyway: this ReHLDS build logs RCON with sv_rcon_log 0 as well (verified live), so the line
// buys nothing today - it stays because the cvar is what a different build would honour.
sv_rcon_log 0

// First person camera: 0 = the chase camera only (the default picture), 1 = after the bot on camera
// gets a kill the capture client is cut into its eyes for stcam_pov_sec seconds (plugins/stream_cam).
// Disabled by default and overridable per host: infra/entrypoint.sh rewrites this line from
// STREAM_POV, so the feature can be switched off without touching the image.
stcam_pov 0
stcam_pov_sec 2.5

